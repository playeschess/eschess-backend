name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eschess
          POSTGRES_PASSWORD: eschess
          POSTGRES_DB: eschess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eschess -d eschess"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://eschess:eschess@localhost:5432/eschess
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace -- --ignored   # the tests that need Postgres
