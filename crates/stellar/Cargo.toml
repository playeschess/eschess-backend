[package]
name = "eschess-stellar"
description = "The Stellar network: reading incoming payments, and building and signing outgoing ones. No database."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The tests that talk to the real Stellar testnet (they need keys and the network, so CI does not build them):
#   cargo test -p <crate> --features live-testnet --test <name> -- --ignored --nocapture
[features]
live-testnet = []

[dependencies]
eschess-domain = { path = "../domain" }
async-trait.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
stellar-xdr.workspace = true
zeroize.workspace = true
aes-gcm.workspace = true
rand.workspace = true
hex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio.workspace = true
