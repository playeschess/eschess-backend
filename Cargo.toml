[workspace]
resolver = "2"
members = ["crates/domain", "crates/ledger", "crates/fairplay", "crates/auth", "crates/game", "crates/notification", "crates/stellar", "crates/lichess", "crates/storage", "bins/api", "bins/migrate", "bins/worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# One place for dependency versions, so every crate agrees.
[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest = "1"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
futures = "0.3"
argon2 = "0.5"
async-trait = "0.1"
rand = "0.8"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "base64"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
zeroize = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid"] }

# Password hashing is deliberately slow; keep it usable in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3

# The chess rules are pure and CPU-bound, and their tests count millions of positions; optimise them even in
# debug builds so the tests run in seconds.
[profile.dev.package.eschess-domain]
opt-level = 3
