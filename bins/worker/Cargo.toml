description = "Money jobs, kept out of the API so a retry storm cannot slow the move loop: crediting deposits and sending withdrawals."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eschess-api = { path = "../api" }
eschess-domain = { path = "../../crates/domain" }
eschess-fairplay = { path = "../../crates/fairplay" }
eschess-storage = { path = "../../crates/storage" }
eschess-stellar = { path = "../../crates/stellar" }
sqlx.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
eschess-ledger = { path = "../../crates/ledger" }
async-trait.workspace = true
futures.workspace = true
stellar-xdr.workspace = true
